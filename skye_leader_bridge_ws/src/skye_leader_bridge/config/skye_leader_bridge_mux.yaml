arms:
  left:
    enabled: true
    input_topic: /left_joint_control
    output_topic: /control/model/joint_cmd_A
    joint_order: [0, 1, 2, 3, 4, 5, 6]
    signs: [1, 1, 1, -1, 1, -1, -1]
    offsets: [0, 0, 0, 0, 0, 0, 0]
    limits_min: [-3.1067, -2.01, -3.1067, -1.0472, -3.1067, -1.0472, -1.5708]
    limits_max: [3.1067, 2.01, 3.1067, 2.53, 3.1067, 1.0472, 1.5708]
  right:
    enabled: true
    input_topic: /right_joint_control
    output_topic: /control/model/joint_cmd_B
    joint_order: [0, 1, 2, 3, 4, 5, 6]
    signs: [1, 1, 1, -1, 1, -1, -1]
    offsets: [0, 0, 0, 0, 0, 0, 0]
    limits_min: [-3.1067, -2.01, -3.1067, -1.0472, -3.1067, -1.0472, -1.5708]
    limits_max: [3.1067, 2.01, 3.1067, 2.53, 3.1067, 1.0472, 1.5708]

grippers:
  left:
    enabled: true
    input_topic: /left_teleop_gripper/ctrl
    output_topic: /control/gripperValueL
    output_type: float32
    input_min: 0.0
    input_max: 1.0
    output_min: 0.0
    output_max: 1.0
    invert: false
    deadband: 0.02
  right:
    enabled: true
    input_topic: /right_teleop_gripper/ctrl
    output_topic: /control/gripperValueR
    output_type: float32
    input_min: 0.0
    input_max: 1.0
    output_min: 0.0
    output_max: 1.0
    invert: false
    deadband: 0.02

mode:
  sync_topic: /mode/switch_sync
  teleop_topic: /mode/switch_teleop
  stop_topic: /mode/switch_stop

safety:
  require_enable: true
  leader_timeout_s: 0.2
  max_delta_per_cycle: 0.05
  publish_rate_hz: 250
  # Mux mode publishes into /control/model/*, so /control/joint_cmd_A/B can
  # be owned by /joint_cmd_mux.
  allow_existing_joint_publishers: false
  existing_publisher_check_delay_s: 1.0

message:
  # Skye JointcmdArm was confirmed as `float64[7] positions`.
  # The first existing field will be filled.
  joint_command_fields: [positions, joint_pos, joint_position, joint_positions, position, pos, data]
