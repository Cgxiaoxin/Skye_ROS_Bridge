# Skye operator UI defaults (v1 host console).
bind_host: "127.0.0.1"
port: 8765
step_timeout_s: 120.0
log_ring_size: 2000
# How long a dispatched command stays "pending" before the UI unlocks the
# buttons again (pending also clears early once the state confirms the command).
pending_timeout_s: 8.0

# Per-profile Gento/Skye controller IP used by session-start precheck ping.
controller_ips:
  thor: "6.6.7.191"
  orin: "6.6.7.190"

# Whitelist argv for residual cleanup (manual API + auto on session start).
# Session start precheck runs these when a leftover skye_robot_driver is found
# (unless allow_existing_driver and playbook step 1 is driver). Empty falls back
# to pkill -f skye_robot_driver only.
cleanup_stale_commands:
  - ["pkill", "-f", "skye_robot_driver"]
  - ["pkill", "-f", "factr_teleop"]
  - ["docker", "rm", "-f", "skye_marvin_m6"]

# Session stop safety net (after process-group terminate).
# Hold leader arms before ending a session — disable_leader drops torque.
teardown:
  marvin_container_name: skye_marvin_m6
  disable_leader: true
  # Host Python usually lacks dynamixel_sdk; prefer one-shot Marvin image.
  disable_via_docker: true
  marvin_image: harbor.amigos-robot.com/tmp/marvin-m6-ros2:humble
  docker_rm_timeout_s: 20.0
  disable_timeout_s: 60.0

# Playbook tuning. playbook_override (per-mode step list) may also be injected at runtime.
playbook:
  # scripts/run_marvin_m6_impedance.sh opens an interactive docker shell when
  # MARVIN_LAUNCH_CMD is unset, and runs the command non-interactively when set.
  # Override the wrapper argv list here only if you need a different entrypoint:
  # marvin_start_cmd: ["/path/to/non_interactive_marvin_wrapper.sh"]
  marvin_start_cmd: null
  # Container launch line, exported as MARVIN_LAUNCH_CMD for the marvin wrapper.
  # When unset the playbook falls back to the per-mode defaults below.
  # Teleop: ros2 launch /marvin_ws/launch_overlay/start_teleop_m6_dual_gento.launch.py use_keyboard:=false
  # HITL:   ros2 launch /marvin_ws/launch_overlay/start_teleop_m6_dual_gento_hitl.launch.py use_keyboard:=false
  # Full example including the workspace source step:
  # marvin_launch_cmd: >-
  #   source /marvin_ws/install/setup.bash &&
  #   ros2 launch /marvin_ws/launch_overlay/start_teleop_m6_dual_gento.launch.py use_keyboard:=false
  marvin_launch_cmd: null

# DAgger: when true, arbiter step sets ENABLE_RECORDER=true on start_hitl_host.sh
# (single host launch; do not start the arbiter script twice).
enable_hitl_recorder: false
